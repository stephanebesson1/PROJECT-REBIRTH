
name: Build PROJECT REBIRTH APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Project_Rebirth_Android_Studio.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          unzip Project_Rebirth_Android_Studio.zip -d source

      - name: Build APK
        run: |
          cd source/ProjectRebirth
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-REBIRTH-APK
          path: source/ProjectRebirth/app/build/outputs/apk/debug/app-debug.apk
